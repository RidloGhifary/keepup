services:
  keepup:
    image: ridloghfry/keepup:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keepup
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - RUST_LOG=info,keepup=debug
      - KEEPUP_DB_PATH=/data/keepup.db
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - JWT_SECRET=change-this-in-production-keepup-jwt-secret
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/public/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
