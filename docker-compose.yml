services:
  keepup:
    image: ridloghfry/keepup:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keepup
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - RUST_LOG=info,keepup=info
      - KEEPUP_DB_PATH=/data/keepup.db
      - ADMIN_USER=${ADMIN_USER:-admin}
      # Leave ADMIN_PASSWORD and JWT_SECRET unset to auto-generate and persist strong secrets in /data/keepup.db,
      # or supply strong values via your local .env file:
      # - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # - JWT_SECRET=${JWT_SECRET}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/public/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
